services:
  - type: web
    name: molio-portfolio
    runtime: python
    plan: free
    rootDir: myportfolio
    # Deploys are driven by GitHub Actions (see .github/workflows/deploy.yml),
    # so disable Render's own auto-deploy to avoid double deploys.
    autoDeploy: false
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong secret for you
      - key: DATABASE_URL
        sync: false                # paste your Neon connection string
      - key: CLOUDINARY_URL
        sync: false                # paste your Cloudinary URL
      - key: ALLOWED_HOSTS
        sync: false                # e.g. molio-portfolio.onrender.com
