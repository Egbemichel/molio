name: Sync GitHub Projects

# Monthly import of public repos into the portfolio DB (as drafts), plus a
# manual trigger. Runs the Django management command directly against Neon.
on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myportfolio
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      GITHUB_USERNAME: Egbemichel
      # The auto-provided Actions token is enough for public repo reads.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: myportfolio/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required secrets are set
        run: |
          missing=
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$SECRET_KEY" ] && missing="$missing SECRET_KEY"
          [ -z "$CLOUDINARY_URL" ] && missing="$missing CLOUDINARY_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions secret(s):$missing — add them in Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Ensure Neon has the latest schema before syncing (Vercel doesn't migrate).
      - name: Apply migrations
        run: python manage.py migrate --no-input

      - name: Sync repositories
        run: python manage.py sync_github
