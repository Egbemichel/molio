name: CI/CD

# Every push to main runs the test suite and, if green, ships to Render.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myportfolio
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev   # sqlite, no external DB needed
      SECRET_KEY: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: myportfolio/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity=2

  deploy:
    name: Promote to release (Back4App deploys this)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Back4App auto-deploys the `release` branch. We only advance it once the
      # test job above is green, so broken commits never reach production.
      - name: Promote tested commit to release branch
        run: git push origin HEAD:release --force
