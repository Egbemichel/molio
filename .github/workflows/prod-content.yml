name: Production content

# Manual, one-off jobs against the production database (Neon) and media
# (Cloudinary), using the repo secrets — no credentials on anyone's laptop.
#   inspect  — list what's in production (projects, categories, photos)
#   migrate  — apply database migrations
#   seed     — migrate, then load the design projects + photos (keeps existing rows)
#   refresh  — migrate, then rebuild the seeded projects from seed_data.py
#              (discards admin edits to those projects)
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        required: true
        default: inspect
        type: choice
        options: [inspect, migrate, seed, refresh]

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myportfolio
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: myportfolio/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show migration state
        run: python manage.py showmigrations core projects

      - name: Inspect
        if: inputs.task == 'inspect'
        run: |
          python manage.py shell -c "
          from apps.projects.models import Project, Category
          from apps.core.models import GalleryItem
          print('CATEGORIES:', list(Category.objects.values_list('name', flat=True)))
          # values_list: works before the new columns exist, too
          for slug, published, cat in Project.objects.order_by('order').values_list('slug', 'published', 'category__name'):
              print(f'PROJECT  {slug:32} published={published!s:5} category={cat}')
          print('GALLERY ITEMS:', GalleryItem.objects.count())
          "

      - name: Migrate
        if: inputs.task != 'inspect'
        run: python manage.py migrate --no-input

      - name: Seed
        if: inputs.task == 'seed'
        run: python manage.py seed_content

      - name: Refresh seeded projects
        if: inputs.task == 'refresh'
        run: python manage.py seed_content --refresh
