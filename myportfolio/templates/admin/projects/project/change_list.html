{% extends "admin/change_list.html" %}

{% comment %}
Projects changelist + a "Sync from GitHub" button. Posts to the custom admin
view registered in ProjectAdmin.get_urls (projects_project_sync_github).
{% endcomment %}

{% block content %}
<form method="post" action="{% url 'admin:projects_project_sync_github' %}"
      style="margin-bottom: 20px;">
    {% csrf_token %}
    <button type="submit" class="button default" style="display:inline-flex;align-items:center;gap:8px;">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Sync from GitHub
    </button>
</form>
{{ block.super }}
{% endblock %}
